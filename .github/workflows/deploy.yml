name: 🚀 Deploy website on tag
on:
  push:
    tags:
      - '*'

jobs:
  build:
    if: github.event.base_ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: ↧ Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: ↧ npm ci
        # Dependency lifecycle scripts are not executed (supply-chain hardening).
        # Our own postinstall (copy jQuery, lint) is run explicitly instead.
        run: |
          npm ci --ignore-scripts
          npm run postinstall
      - name: ⚛ Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - name: ↧ Install Dart Sass
        env:
          DART_SASS_VERSION: '1.108.1'
        run: |
          curl --proto "=https" --tlsv1.2 -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
      - name: ⚙ Build
        run: npm run build
      - name: 𝍖 Create Index
        run: npm run index
      - name: 🏷️ Get tag name
        run: echo "TAG_NAME=$(echo ${GITHUB_REF#refs/*/} | tr / -)" >> $GITHUB_ENV
      - name: 📂 Archive
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: release-diff
          FOLDER: public
          CLEAN: true
          COMMIT_MESSAGE: Release ${{ env.TAG_NAME }}
      - name: 🎉 Deploy
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          port: 22
          uploads: |
            ./public/ => ./public_html/
          ignore: |
            *.git
            */**/*git*
