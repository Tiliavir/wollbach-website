{{- $currentPage := . -}}
<nav class="navigation" aria-label="Hauptnavigation">
  <div class="navigation-bar">
    <a class="navigation-brand" href="/">
      <img src="/img/wappen.png" alt="" width="40" height="40"/>
      <span>{{ .Site.Title }}</span>
    </a>

    <input id="navigation-checkbox" class="navigation-checkbox" type="checkbox"/>
    <label class="navigation-hamburger" for="navigation-checkbox">
      <span></span>
      <span class="navigation-label">Menü öffnen/schließen</span>
    </label>

    <div class="navigation-menu">
      <ul>
        {{- range .Site.Menus.main }}
          {{- if .HasChildren }}
          <li class="dropdown{{ if $currentPage.HasMenuCurrent "main" . }} active{{ end }}">
            <button type="button" class="dropdown-toggle" aria-expanded="false">
              <span>{{ .Name }}</span>
              {{ partial "icon.html" (dict "name" "chevron-down" "size" 16 "class" "dropdown-arrow") }}
            </button>
            <ul class="sub-menu">
              {{- range .Children }}
              <li{{ if $currentPage.IsMenuCurrent "main" . }} class="active"{{ end }}>
                <a href="{{ .URL }}"{{ if $currentPage.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
              </li>
              {{- end }}
            </ul>
          </li>
          {{- else }}
          <li{{ if $currentPage.IsMenuCurrent "main" . }} class="active"{{ end }}>
            <a href="{{ .URL }}"{{ if $currentPage.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
          {{- end }}
        {{- end }}
      </ul>
    </div>
  </div>
</nav>

<img class="print-only" src="/img/wappen.png" alt="{{ .Site.Title }}"/>
