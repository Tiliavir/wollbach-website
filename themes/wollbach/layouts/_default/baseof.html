<!DOCTYPE html>
<html lang="de">
<head prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb# website: http://ogp.me/ns/website#">
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{- .Title -}}{{ cond (eq .Title "") "" " | " }}{{- .Site.Title -}}</title>
  {{- partial "header.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }}" itemscope itemtype="https://schema.org/{{- .Page.Params.schemaorg | default "WebPage" -}}">
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
  {{- partial "navigation.html" . -}}
  {{- block "hero" . }}{{ end }}
  <main id="inhalt" class="content{{ if .Params.wide }} content--wide{{ end }}" itemprop="mainContentOfPage">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . -}}
</body>
</html>
