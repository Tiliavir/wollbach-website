<!DOCTYPE html>
<html lang="de">
<head prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb# website: http://ogp.me/ns/website#">
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{- .Title -}}{{ cond (eq .Title "") "" " | " }}{{- .Site.Title -}}</title>
  {{- partial "header.html" . }}
</head>
<body itemscope itemtype="https://schema.org/{{- .Page.Params.schemaorg | default "WebPage" -}}">
  <header class="header">
    <div class="cover">
      <a class="navigation-brand" href="/">
        <img src="/img/wappen.png" alt="Wollbach" />
      </a>
    </div>
  </header>
  {{- partial "navigation.html" . -}}
  <main class="content" itemprop="mainContentOfPage">
    <div class="homepage-hero">
      <h1>{{- .Title -}}</h1>
    </div>

    {{ .Content }}
  </main>
  {{- partial "footer.html" . -}}
</body>
</html>
